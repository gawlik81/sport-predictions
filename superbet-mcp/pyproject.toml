[project]
name = "superbet-mcp"
version = "0.1.0"
description = "Connector MCP do superbet.pl: kursy, notatki/analizy meczów, kupony z zabezpieczeniami"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
